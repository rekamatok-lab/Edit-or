name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find app folder
        run: |
          F=$(find . -name package.json -not -path '*/node_modules/*' | head -1)
          if [ -z "$F" ]; then echo "package.json not found in repo"; ls -R | head -50; exit 1; fi
          echo "APP_DIR=$(dirname "$F")" >> "$GITHUB_ENV"
          echo "Found app in: $(dirname "$F")"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install

      - name: Add Android platform
        working-directory: ${{ env.APP_DIR }}
        run: npx cap add android

      - name: Patch MainActivity
        working-directory: ${{ env.APP_DIR }}
        run: |
          cat > android/app/src/main/java/com/studio/videostudio/MainActivity.java <<'EOF'
          package com.studio.videostudio;

          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
            }
            @Override
            public void onStart() {
              super.onStart();
              try { getBridge().getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false); } catch (Exception e) {}
            }
          }
          EOF

      - name: Sync
        working-directory: ${{ env.APP_DIR }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: video-studio-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Video Studio build ${{ github.run_number }}
          files: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
